name: Build and Push Docker Image
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch:
  push:
    branches: [main, feat/material-3-expressive]
  release:
    types: [published]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=wishlist-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wishlist-${{ matrix.arch }}

      - name: Verify container startup
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker run -d --name wishlist-smoke -p 127.0.0.1:3280:3280 \
            -e ORIGIN=http://localhost:3280 "$IMAGE"
          curl --fail --location --retry 30 --retry-delay 2 --retry-all-errors \
            --max-time 5 --output /dev/null http://localhost:3280/setup-wizard
          test "$(docker inspect --format '{{.State.Running}}' wishlist-smoke)" = true

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs wishlist-smoke || true
          docker rm -fv wishlist-smoke || true

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker Tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=material-3-expressive,enable=${{ github.ref == 'refs/heads/feat/material-3-expressive' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Publish tested images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "$tag")
          done
          docker buildx imagetools create "${arguments[@]}" \
            "$IMAGE:sha-$COMMIT_SHA-amd64" "$IMAGE:sha-$COMMIT_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT_SHA"
