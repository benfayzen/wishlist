name: Build and Push Docker Image
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  release:
    types: [published]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registration protection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # These commands both generate .svelte-kit files; keep them sequential.
      - name: Type and Svelte checks
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Lint and formatting
        run: pnpm run lint

      - name: Security and SQLite tests
        run: node --import tsx --test tests/security/registration.node.ts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Registration HTTP and browser tests
        run: node --import tsx --test tests/security/registration-http.node.ts

  build:
    needs: verify
    name: Build and publish (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=wishlist-amd64
          cache-to: type=gha,mode=max,scope=wishlist-amd64

      - name: Verify container startup
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-amd64
        run: |
          docker run -d --name wishlist-smoke -p 127.0.0.1:3280:3280 \
            -e ORIGIN=http://localhost:3280 "$IMAGE"
          curl --fail --location --retry 30 --retry-delay 2 --retry-all-errors \
            --max-time 5 --output /dev/null http://localhost:3280/setup-wizard
          test "$(docker inspect --format '{{.State.Running}}' wishlist-smoke)" = true

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs wishlist-smoke || true
          docker rm -fv wishlist-smoke || true

      - name: Docker Tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Publish tested image tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "$tag")
          done
          docker buildx imagetools create "${arguments[@]}" \
            "$IMAGE:sha-$COMMIT_SHA-amd64"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT_SHA"
