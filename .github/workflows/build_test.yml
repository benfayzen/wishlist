name: Build and Test
permissions:
    contents: read
    pull-requests: write
    checks: write
    actions: write
on:
    pull_request:
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
            - ".github/ISSUE_TEMPLATE/**"
            - ".github/FUNDING.yml"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker
              id: buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: ./
                  file: ./Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: wishlist:test
                  cache-from: type=gha,scope=wishlist-amd64
                  cache-to: type=gha,mode=max,scope=wishlist-amd64

            - uses: pnpm/action-setup@v6
              name: Install pnpm
              id: pnpm-install
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Browsers
              run: pnpm test:setup

            - name: Run Playwright tests
              run: pnpm test

            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
