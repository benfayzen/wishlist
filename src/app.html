<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme="wishlist">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#f3ebf3" />
        <script>
            (() => {
                let mode = "system";
                try {
                    mode = JSON.parse(localStorage.getItem("mode")) || "system";
                } catch {}
                document.documentElement.dataset.mode =
                    mode === "light" || mode === "dark"
                        ? mode
                        : matchMedia("(prefers-color-scheme: dark)").matches
                          ? "dark"
                          : "light";
                // Match the default shell before hydration, including a saved dark-mode preference.
                document.querySelector('meta[name="theme-color"]').content =
                    document.documentElement.dataset.mode === "dark" ? "#221e24" : "#f3ebf3";
                const media = matchMedia("(prefers-color-scheme: dark)");
                media.addEventListener("change", () => {
                    let current = "system";
                    try {
                        current = JSON.parse(localStorage.getItem("mode")) || "system";
                    } catch {}
                    if (current !== "light" && current !== "dark")
                        document.documentElement.dataset.mode = media.matches ? "dark" : "light";
                });
            })();
        </script>
        <script src="https://code.iconify.design/iconify-icon/2.2.0/iconify-icon.min.js"></script>
        <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico?v=3" />
        <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=3" />
        <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png?v=3" />
        <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png?v=3" />
        <link
            rel="preload"
            href="%sveltekit.assets%/fonts/google-sans-flex/GoogleSansFlex.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        />
        <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg?v=3" color="#8b1fea" />
        <meta name="msapplication-TileImage" content="%sveltekit.assets%/mstile-150x150.png?v=3" />
        <meta name="msapplication-TileColor" content="#8b1fea" />
        %sveltekit.head%
    </head>
    <body>
        <div>%sveltekit.body%</div>
    </body>
</html>
